name: Deploy Backend to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "KCSPback/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build backend jar
        working-directory: KCSPback
        run: chmod +x gradlew && ./gradlew clean build -x test

      - name: Upload jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: KCSPback/build/libs/backend-0.0.1-SNAPSHOT.jar
          target: /home/ubuntu/deploy

      - name: Release and restart backend on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            APP_DIR=/opt/agri-forecast
            SHA=${{ github.sha }}
            NEW_JAR=$APP_DIR/releases/backend-$SHA.jar

            sudo mkdir -p $APP_DIR/releases

            # 롤백 대상으로 현재 릴리스 기억
            PREV_JAR=$(readlink -f $APP_DIR/current.jar || true)

            sudo cp /home/ubuntu/deploy/KCSPback/build/libs/backend-0.0.1-SNAPSHOT.jar $NEW_JAR
            sudo chown ubuntu:ubuntu $NEW_JAR
            sudo ln -sfn $NEW_JAR $APP_DIR/current.jar
            sudo systemctl restart agriforecast

            # 헬스체크: 최대 90초 대기 (기동에 12초 이상 걸림)
            OK=""
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null http://127.0.0.1:8080/api/price/items; then OK=1; break; fi
              sleep 3
            done

            if [ -z "$OK" ]; then
              echo "::error::헬스체크 실패 - 이전 릴리스로 롤백합니다"
              sudo journalctl -u agriforecast -n 60 --no-pager || true
              if [ -n "$PREV_JAR" ] && [ -f "$PREV_JAR" ] && [ "$PREV_JAR" != "$NEW_JAR" ]; then
                sudo ln -sfn "$PREV_JAR" $APP_DIR/current.jar
                sudo systemctl restart agriforecast
                echo "롤백 완료: $PREV_JAR"
              else
                echo "롤백할 이전 릴리스가 없습니다"
              fi
              exit 1
            fi

            # 최근 5개만 보관
            ls -1t $APP_DIR/releases/*.jar | tail -n +6 | xargs -r sudo rm -f

            echo "배포 성공: $SHA"
            systemctl is-active agriforecast
