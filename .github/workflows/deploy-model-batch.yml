name: Deploy Model Batch to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "KCSPmodel/batch/**"
      - ".github/workflows/deploy-model-batch.yml"

jobs:
  deploy-batch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload batch to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: KCSPmodel/batch/*
          target: /home/ubuntu/deploy/model
          strip_components: 2
          rm: true

      - name: Install and verify on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            APP=/opt/agri-forecast/model
            sudo mkdir -p $APP/data && sudo chown -R ubuntu:ubuntu $APP

            # 기상 CSV는 서버가 매 실행마다 갱신하므로 덮어쓰지 않는다
            cp /home/ubuntu/deploy/model/pipeline.py       $APP/pipeline.py
            cp /home/ubuntu/deploy/model/pipeline_onion.py $APP/pipeline_onion.py
            cp /home/ubuntu/deploy/model/data/hist_*.csv $APP/data/
            for f in weather_haenam weather_taebak weather_miryang; do
              [ -f "$APP/data/$f.csv" ] || cp /home/ubuntu/deploy/model/data/$f.csv $APP/data/
            done

            sudo cp /home/ubuntu/deploy/model/agriforecast-predict.service       /etc/systemd/system/
            sudo cp /home/ubuntu/deploy/model/agriforecast-predict.timer         /etc/systemd/system/
            sudo cp /home/ubuntu/deploy/model/agriforecast-predict-onion.service /etc/systemd/system/
            sudo cp /home/ubuntu/deploy/model/agriforecast-predict-onion.timer   /etc/systemd/system/
            sudo systemctl daemon-reload
            # --now 가 있어야 지금 바로 뜬다. enable 만 하면 다음 부팅까지 inactive 다.
            sudo systemctl enable --now agriforecast-predict.timer
            sudo systemctl enable --now agriforecast-predict-onion.timer

            # 품목별로 한 번씩 돌려 실제로 동작하는지 확인. 하나라도 실패하면 배포 실패다.
            FAILED=""
            for u in agriforecast-predict agriforecast-predict-onion; do
              sudo systemctl start $u.service || true
              RESULT=$(systemctl show $u.service -p Result --value)
              echo "--- $u (Result=$RESULT)"
              journalctl -u $u -n 30 --no-pager || true
              [ "$RESULT" = "success" ] || FAILED="$FAILED $u"
            done
            if [ -n "$FAILED" ]; then
              echo "::error::파이프라인 실행 실패:$FAILED"
              exit 1
            fi
            echo "배치 배포 성공"
            systemctl list-timers 'agriforecast-predict*' --no-pager | head -4
