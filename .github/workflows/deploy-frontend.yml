name: Deploy Frontend to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "KCSPfront/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: KCSPfront/package-lock.json

      - name: Build frontend
        working-directory: KCSPfront
        run: |
          npm ci
          npm run build

      - name: Upload frontend build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: KCSPfront/dist/*
          target: /home/ubuntu/deploy/frontend
          strip_components: 2
          rm: true

      - name: Publish frontend on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/react-app
            # assets/ 는 지우지 않고 덮어쓴다. 배포 전에 열어 둔 탭·옛 index.html 캐시가
            # 이전 해시 파일을 찾으면 흰 화면이 되므로, 지난 배포분은 7일 지나서 치운다
            sudo rsync -a --delete --exclude 'assets/' /home/ubuntu/deploy/frontend/ /var/www/react-app/
            sudo rsync -a /home/ubuntu/deploy/frontend/assets/ /var/www/react-app/assets/
            sudo find /var/www/react-app/assets -type f -mtime +7 -delete
            sudo nginx -t
            sudo systemctl reload nginx
