name: CI

# PR 단계 검사. 서버·외부 API·DB 에 붙지 않는다 — 그쪽 실패는 배포 워크플로의 실행 검증이 잡는다.
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-batch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KCSPmodel/batch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'          # 서버(Ubuntu 24.04)와 같은 버전
          cache: pip
          cache-dependency-path: KCSPmodel/batch/requirements.txt
      - name: Install deps (서버와 같은 고정 버전)
        run: pip install -r requirements.txt pytest
      - name: Compile pipelines
        run: python -m py_compile pipeline.py pipeline_onion.py pipeline_redpepper.py pipeline_retail.py backtest.py pipeline_insight.py pipeline_series.py
      - name: Pytest
        run: python -m pytest -q tests

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KCSPmcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: KCSPmcp/requirements.txt
      - name: Install deps (서버와 같은 고정 버전)
        run: pip install -r requirements.txt pytest
      - name: Pytest
        run: python -m pytest -q tests
      # 실제로 띄워 도구 목록이 나오는지 본다. 백엔드는 부르지 않는다(tools/list 만)
      - name: 기동 확인 (tools/list)
        run: |
          python server.py > mcp.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS --max-time 5 -X POST http://127.0.0.1:3001/mcp \
                 -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
                 -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q get_wholesale_forecast; then
              echo "MCP 기동 확인"; exit 0
            fi
            sleep 1
          done
          cat mcp.log; exit 1

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KCSPback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # 기존 테스트 대부분은 실제 농넷·환율 API 를 부르거나 DB 가 필요해 CI 에서 돌리지 않는다.
      # 외부 없이 도는 테스트만 여기에 이름으로 추가한다.
      - name: Compile + 외부 의존 없는 테스트
        run: |
          chmod +x gradlew
          # 테스트를 추가할 땐 한 줄씩 (한 줄에 모으면 PR 끼리 충돌한다)
          ./gradlew compileJava test \
            --tests 'com.agriforecast.backend.service.NaverDataLabServiceRefreshTest' \
            --tests 'com.agriforecast.backend.service.NaverNewsServiceFilterTest' \
            --tests 'com.agriforecast.backend.service.KamisServiceTargetTest' \
            --tests 'com.agriforecast.backend.service.KamisRetailParseTest' \
            --tests 'com.agriforecast.backend.service.KamisRetailSkipTest' \
            --tests 'com.agriforecast.backend.service.KamisWholesaleServiceTest' \
            --tests 'com.agriforecast.backend.service.KamisKindMergeTest' \
            --tests 'com.agriforecast.backend.service.GarakSupplyServiceTest' \
            --tests 'com.agriforecast.backend.service.RetailPriceServiceTest' \
            --tests 'com.agriforecast.backend.util.SoonTest' \
            --tests 'com.agriforecast.backend.service.CommunityVoteServiceTest' \
            --tests 'com.agriforecast.backend.controller.CommunityVoteControllerTest' \
            --tests 'com.agriforecast.backend.service.MarketBriefServiceTest' \
            --tests 'com.agriforecast.backend.config.CommunitySetupTest' \
            --tests 'com.agriforecast.backend.service.PredictionHistoryTest' \
            --tests 'com.agriforecast.backend.service.SignupValidatorTest' \
            --tests 'com.agriforecast.backend.security.JwtProviderTest' \
            --tests 'com.agriforecast.backend.controller.CommunityAuthTest' \
            --tests 'com.agriforecast.backend.controller.AccountAuthTest' \
            --tests 'com.agriforecast.backend.controller.CollectGuardTest' \
            --tests 'com.agriforecast.backend.service.AccountServiceTest' \
            --tests 'com.agriforecast.backend.service.PasswordResetServiceTest' \
            --tests 'com.agriforecast.backend.service.DashboardServiceTest' \
            --tests 'com.agriforecast.backend.controller.DashboardControllerTest' \
            --tests 'com.agriforecast.backend.service.SeriesServiceTest' \
            --tests 'com.agriforecast.backend.controller.SeriesControllerTest' \
            --tests 'com.agriforecast.backend.service.SavedAnalysisServiceTest' \
            --tests 'com.agriforecast.backend.controller.SavedAnalysisControllerTest' \
            --tests 'com.agriforecast.backend.util.WorkbenchQueryTest'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KCSPfront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: KCSPfront/package-lock.json
      - name: Build
        run: |
          npm ci
          npm run build
      # eslint(경고도 실패로 — --max-warnings 0). PropTypes 규칙은 끈다(.eslintrc.cjs)
      - name: Lint
        run: npm run lint
      # 작업대 계산(src/lib/series.js — 주기 맞추기·변환·시차·CSV·주소 상태) 단위 테스트
      - name: Test
        run: npm test
