# AgriForecast 정적 파일 압축·캐시. HTTPS server 블록 안에서 include 한다(README 참고)

# 압축: nginx 기본값은 text/html 만 압축해 JS·CSS·API JSON 이 그대로 나간다
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/css text/plain application/javascript application/json image/svg+xml;

# 빌드 산출물은 파일명에 해시가 붙어 내용이 바뀌면 이름도 바뀐다 → 1년 캐시.
# 없는 파일은 SPA fallback(index.html) 대신 404 를 돌려준다. HTML 을 JS 로 받아 흰 화면이 되는 걸 막는다
location /assets/ {
    root /var/www/react-app;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# index.html 은 매번 서버에 확인한다(바뀌지 않았으면 304). 배포 후 옛 화면이 남지 않게
location = /index.html {
    root /var/www/react-app;
    add_header Cache-Control "no-cache";
}
